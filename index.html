<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Chạy Trạm Ký Sinh Trùng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Phòng Thi Thử Ký Sinh Trùng</h1>
            <p class="text-slate-500">Tải ảnh slide, thiết lập đáp án và luyện tập phản xạ chạy trạm cực nhanh</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex justify-center mb-6">
            <div class="bg-slate-200 p-1 rounded-xl flex space-x-2">
                <button id="tab-config" onclick="switchTab('config')" class="px-6 py-2.5 rounded-lg font-medium text-sm transition-all bg-white text-blue-600 shadow-sm">1. Thiết Lập Ảnh & Đáp Án</button>
                <button id="tab-test" onclick="switchTab('test')" class="px-6 py-2.5 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900">2. Vào Thi Chạy Trạm</button>
            </div>
        </div>

        <!-- TAB 1: CONFIG -->
        <div id="panel-config" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <div>
                    <h2 class="text-lg font-semibold text-slate-800">Danh sách slide Ký sinh trùng</h2>
                    <p class="text-sm text-slate-500" id="total-count">Đã thêm: 0 slide</p>
                </div>
                <div class="flex gap-3">
                    <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Thêm Ảnh Mới
                        <input type="file" id="image-upload" multiple accept="image/*" class="hidden" onchange="handleFiles(this)">
                    </label>
                    <button onclick="clearAll()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-medium transition border border-red-200">Xóa hết</button>
                </div>
            </div>

            <!-- List of items -->
            <div id="items-container" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                <div id="empty-state" class="text-center py-12 border-2 border-dashed border-slate-200 rounded-xl">
                    <svg class="w-12 h-12 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <p class="text-slate-500 font-medium">Chưa có ảnh nào được thêm.</p>
                    <p class="text-slate-400 text-sm mt-1">Bấm "Thêm Ảnh Mới" để bắt đầu tải slide bài học lên.</p>
                </div>
            </div>

            <div class="mt-6 pt-6 border-t border-slate-100 flex justify-end">
                <button onclick="switchTab('test')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm transition shadow-sm flex items-center gap-2">
                    Bắt đầu luyện tập ngay
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>
        </div>

        <!-- TAB 2: TEST -->
        <div id="panel-test" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div id="test-empty" class="text-center py-12">
                <p class="text-slate-500 font-medium mb-3">Bạn chưa thêm ảnh nào để thi thử!</p>
                <button onclick="switchTab('config')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium">Quay lại phần Thiết lập</button>
            </div>

            <div id="test-active" class="hidden">
                <!-- Status Bar -->
                <div class="flex justify-between items-center mb-4 text-sm text-slate-500 font-medium bg-slate-50 p-3 rounded-xl">
                    <span id="test-progress">Slide 1 / 10</span>
                    <span id="test-score">Đúng: 0 | Sai: 0</span>
                </div>

                <!-- Image Display Box -->
                <div class="bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center h-[380px] mb-6 relative shadow-inner">
                    <img id="current-img" src="" alt="Slide Ký sinh trùng" class="max-h-full max-w-full object-contain p-2">
                </div>

                <!-- Input Answer Area -->
                <div class="space-y-4">
                    <div class="relative">
                        <input type="text" id="user-answer" placeholder="Gõ tên ký sinh trùng rồi bấm Enter..." autocomplete="off"
                            class="w-full bg-slate-50 border-2 border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-3.5 text-base outline-none transition font-medium">
                    </div>

                    <!-- Feedback Box -->
                    <div id="feedback-box" class="hidden p-4 rounded-xl text-sm font-medium flex items-center justify-between">
                        <span id="feedback-text"></span>
                        <button onclick="nextSlide()" class="bg-white/80 hover:bg-white text-slate-800 px-4 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition">Tiếp tục (Enter ↵)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let slides = [];
        let currentIndex = 0;
        let scoreCorrect = 0;
        let scoreIncorrect = 0;
        let isAnswerChecked = false;

        function switchTab(tab) {
            const configTab = document.getElementById('tab-config');
            const testTab = document.getElementById('tab-test');
            const configPanel = document.getElementById('panel-config');
            const testPanel = document.getElementById('panel-test');

            if (tab === 'config') {
                configTab.className = "px-6 py-2.5 rounded-lg font-medium text-sm transition-all bg-white text-blue-600 shadow-sm";
                testTab.className = "px-6 py-2.5 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900";
                configPanel.classList.remove('hidden');
                testPanel.classList.add('hidden');
            } else {
                configTab.className = "px-6 py-2.5 rounded-lg font-medium text-sm transition-all text-slate-600 hover:text-slate-900";
                testTab.className = "px-6 py-2.5 rounded-lg font-medium text-sm transition-all bg-white text-blue-600 shadow-sm";
                configPanel.classList.add('hidden');
                testPanel.classList.remove('hidden');
                initTest();
            }
        }

        function handleFiles(input) {
            const files = input.files;
            if (!files.length) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    slides.push({
                        id: Date.now() + Math.random(),
                        url: e.target.result,
                        answer: ''
                    });
                    renderConfigList();
                }
                reader.readAsDataURL(file);
            });
            input.value = '';
        }

        function updateAnswer(id, val) {
            const item = slides.find(s => s.id === id);
            if (item) item.answer = val;
        }

        function removeSlide(id) {
            slides = slides.filter(s => s.id !== id);
            renderConfigList();
        }

        function clearAll() {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ danh sách slide không?")) {
                slides = [];
                renderConfigList();
            }
        }

        function renderConfigList() {
            const container = document.getElementById('items-container');
            const emptyState = document.getElementById('empty-state');
            const totalCount = document.getElementById('total-count');

            totalCount.innerText = `Đã thêm: ${slides.length} slide`;

            if (slides.length === 0) {
                emptyState.style.display = 'block';
                container.innerHTML = '';
                container.appendChild(emptyState);
                return;
            }

            emptyState.style.display = 'none';
            let html = '';
            slides.forEach((slide, index) => {
                html += `
                    <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-sm font-bold text-slate-400 w-6 text-center">#${index + 1}</span>
                        <img src="${slide.url}" class="w-16 h-16 object-cover rounded-lg border border-slate-200 bg-white">
                        <div class="flex-1">
                            <input type="text" value="${slide.answer}" placeholder="Nhập tên ký sinh trùng chính xác..." 
                                oninput="updateAnswer(${slide.id}, this.value)"
                                class="w-full bg-white border border-slate-200 focus:border-blue-500 rounded-lg px-3 py-2 text-sm outline-none transition font-medium">
                        </div>
                        <button onclick="removeSlide(${slide.id})" class="text-slate-400 hover:text-red-600 p-2 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function initTest() {
            const testEmpty = document.getElementById('test-empty');
            const testActive = document.getElementById('test-active');

            if (slides.length === 0) {
                testEmpty.classList.remove('hidden');
                testActive.classList.add('hidden');
                return;
            }

            testEmpty.classList.add('hidden');
            testActive.classList.remove('hidden');
            currentIndex = 0;
            scoreCorrect = 0;
            scoreIncorrect = 0;
            loadSlideTest();
        }

        function loadSlideTest() {
            isAnswerChecked = false;
            const currentImg = document.getElementById('current-img');
            const userAnswer = document.getElementById('user-answer');
            const feedbackBox = document.getElementById('feedback-box');
            const testProgress = document.getElementById('test-progress');
            const testScore = document.getElementById('test-score');

            currentImg.src = slides[currentIndex].url;
            userAnswer.value = '';
            userAnswer.disabled = false;
            userAnswer.className = "w-full bg-slate-50 border-2 border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-3.5 text-base outline-none transition font-medium";
            userAnswer.focus();

            feedbackBox.classList.add('hidden');
            testProgress.innerText = `Slide ${currentIndex + 1} / ${slides.length}`;
            testScore.innerText = `Đúng: ${scoreCorrect} | Sai: ${scoreIncorrect}`;
        }

        function normalizeStr(str) {
            return str.toLowerCase().trim().replace(/\s+/g, ' ');
        }

        function checkAnswer() {
            if (isAnswerChecked) {
                nextSlide();
                return;
            }

            const userAnswer = document.getElementById('user-answer');
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackText = document.getElementById('feedback-text');
            const testScore = document.getElementById('test-score');

            const userVal = normalizeStr(userAnswer.value);
            const correctVal = normalizeStr(slides[currentIndex].answer);

            if (!userVal) return; // Không gõ gì thì không check

            isAnswerChecked = true;
            userAnswer.disabled = true;

            if (userVal === correctVal) {
                scoreCorrect++;
                userAnswer.className = "w-full bg-emerald-50 border-2 border-emerald-500 rounded-xl px-4 py-3.5 text-base outline-none font-medium text-emerald-900";
                feedbackBox.className = "p-4 rounded-xl text-sm font-medium flex items-center justify-between bg-emerald-500 text-white shadow-sm";
                feedbackText.innerHTML = `Chính xác tuyệt vời! 🎉`;
            } else {
                scoreIncorrect++;
                userAnswer.className = "w-full bg-rose-50 border-2 border-rose-500 rounded-xl px-4 py-3.5 text-base outline-none font-medium text-rose-900";
                feedbackBox.className = "p-4 rounded-xl text-sm font-medium flex items-center justify-between bg-rose-500 text-white shadow-sm";
                feedbackText.innerHTML = `Chưa đúng! Đáp án chuẩn: <strong class="underline ml-1">${slides[currentIndex].answer}</strong>`;
            }

            feedbackBox.classList.remove('hidden');
            testScore.innerText = `Đúng: ${scoreCorrect} | Sai: ${scoreIncorrect}`;
        }

        function nextSlide() {
            currentIndex++;
            if (currentIndex >= slides.length) {
                alert(`Đã hoàn thành vòng ôn tập!\nTổng kết:\n- Số câu đúng: ${scoreCorrect}\n- Số câu sai: ${scoreIncorrect}`);
                currentIndex = 0;
            }
            loadSlideTest();
        }

        document.getElementById('user-answer').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkAnswer();
            }
        });
    </script>
</body>
</html>
